name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install (CPU only, no model download)
        run: pip install -r requirements-dev.txt
      - name: Lint (undefined names, unused imports)
        run: pip install pyflakes && python -m pyflakes src mcp_server tests
      - name: Unit tests
        run: python -m pytest -q
      - name: MCP end-to-end (server + client over stdio)
        run: python mcp_server/demo_client.py
